<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>巡查拍照上傳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --ground:#EDEFEC; --surface:#FFFFFF; --sunken:#E3E6E2; --ink:#1C2630; --ink-2:#4A5560; --ink-3:#7A848C;
  --line:#CDD2CE; --line-strong:#AEB5B0;
  --accent:#E8A900; --accent-ink:#1C2630; --accent-soft:#FBF0CC;
  --bad:#B8402A; --bad-soft:#F6E1DC; --ok:#2F7A4E; --ok-soft:#DDEFE3;
  --focus:#2C6FB7;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#151B20; --surface:#1E262D; --sunken:#11161A; --ink:#E6EAE7; --ink-2:#B2BAB6; --ink-3:#86908C;
    --line:#2F3A42; --line-strong:#46525B;
    --accent:#F2B705; --accent-ink:#151B20; --accent-soft:#3A3113;
    --bad:#E27A63; --bad-soft:#3B221D; --ok:#6CC08F; --ok-soft:#1C3325;
    --focus:#79AEEA;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--ground);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar{background:var(--sunken);color:var(--ink)}}
.bar i{width:20px;height:20px;flex:none;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,var(--ink) 5px 10px);border-radius:3px;border:1.5px solid var(--accent)}
.bar b{font-weight:700;letter-spacing:.04em}
.bar .who{margin-left:auto;font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font-size:21px;margin:4px 0 2px;line-height:1.3}
.sub{color:var(--ink-2);font-size:14px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;margin-top:24px;display:flex;flex-direction:column;gap:12px;align-items:center}
.msg.err{border-color:var(--bad);background:var(--bad-soft)}
.msg span{overflow-wrap:anywhere;word-break:break-word;max-width:100%}

.mlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.mbtn{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.mbtn:active{background:var(--accent-soft)}
.mbtn .d{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.mbtn .s{font-size:19px;font-weight:700}
.mbtn .p{font-size:13px;color:var(--ink-3);grid-column:1}
.mbtn .n{grid-row:1/4;grid-column:2;text-align:right;font-size:13px;color:var(--ink-2)}
.mbtn .n b{display:block;font-family:var(--mono);font-size:22px;color:var(--ink)}
.today{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;margin-left:6px;vertical-align:2px}

.back{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:14px}
.field span{font-size:13px;color:var(--ink-3)}
.field input,.field textarea{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:16px}
.shoot{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:14px}
.shoot label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;padding:18px 8px;font-weight:700;cursor:pointer;min-height:92px;text-align:center}
.shoot label small{font-weight:400;font-size:12px}
.shoot .cam{background:var(--accent);color:var(--accent-ink);font-size:19px}
.shoot .alb{background:var(--surface);border:1.5px solid var(--line-strong);font-size:16px}
.shoot .ico{font-size:28px;line-height:1}
.shoot input{position:absolute;width:1px;height:1px;opacity:0}
.hint{font-size:13px;color:var(--ink-3);margin-top:8px}

.mine-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 8px;border-top:2px solid var(--ink);padding-top:10px}
.mine-h h2{font-size:16px;margin:0}
.item{display:grid;grid-template-columns:108px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.thumb{position:relative;width:108px;height:108px;border-radius:8px;overflow:hidden;background:var(--sunken)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .st{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,26,30,.5);color:#fff;font-size:13px;font-weight:500;text-align:center;padding:4px}
.thumb .st.fail{background:rgba(160,40,20,.75)}
.item .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.item .loc{font-size:13px;color:var(--ink-2)}
.item textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:15px;resize:vertical;min-height:54px}
.item .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.tag{background:var(--ok-soft);color:var(--ok);padding:0 8px;border-radius:999px;font-size:12px;font-weight:500}
.lnk{background:none;border:0;padding:0;color:var(--ink-3);text-decoration:underline;cursor:pointer;font-size:13px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.empty{color:var(--ink-3);font-size:14px;text-align:center;padding:18px 0}
.upbar{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:9;margin:-16px -16px 14px;padding:9px 16px;background:var(--accent-soft);border-bottom:1px solid var(--accent);font-size:14px;font-weight:500}
.upbar.fail{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
/* 標註編輯器 */
.ed{position:fixed;inset:0;z-index:50;background:#111417;color:#fff;display:flex;flex-direction:column}
.ed-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px}
.ed-top .sp{flex:1}
.ed button{font:inherit;color:#fff;background:#2A3137;border:1px solid #3A434B;border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer;white-space:nowrap}
.ed button:disabled{opacity:.4}
.ed button.ok{background:#E8A900;border-color:#E8A900;color:#1C2630;font-weight:700}
.ed-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px;position:relative}
.ed-stage canvas{max-width:100%;max-height:100%;touch-action:none;display:block;box-shadow:0 0 0 1px #333}
.ed-tools{display:flex;flex-direction:column;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;gap:6px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px}
.seg button[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff;font-weight:700}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:inline-block}
.lw{display:inline-block;width:28px;border-radius:4px;background:currentColor}
.ed .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6);font-size:15px}
.bind{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px;display:flex;flex-direction:column;gap:12px}
.bind select{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:12px;font-size:17px}
.bind .confirm{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:12px;font-size:15px}
.bind .row{display:flex;gap:10px}
.bind .row .btn{flex:1;padding:12px;font-size:16px}
/* 模式切換、改善登錄 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:-16px -16px 16px;border-bottom:1px solid var(--line-strong);background:var(--surface)}
.modes button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 8px 10px;font-size:15px;font-weight:500;color:var(--ink-2);cursor:pointer}
.modes button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.upbar{top:calc(52px + env(safe-area-inset-top,0px))}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.fitem{display:grid;grid-template-columns:auto 76px 1fr;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid #A86A00;border-radius:12px;padding:10px;margin-top:10px;cursor:pointer}
.fitem.done{border-left-color:var(--ok)}
.fitem .no{font-family:var(--mono);font-weight:600;font-size:18px}
.fitem .tb{width:76px;height:76px;border-radius:8px;overflow:hidden;background:var(--sunken)}
.fitem .tb img{width:100%;height:100%;object-fit:cover;display:block}
.fitem .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.fitem .tx b{font-size:15px;line-height:1.35}
.fitem .tx small{font-size:12.5px;color:var(--ink-2)}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:0 8px;border-radius:999px;background:#FBEBCB;color:#A86A00}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.fsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.fsec h2{font-size:15px;margin:0;letter-spacing:.08em;color:var(--ink-2)}
.fsec .field{margin-top:0}
.fphoto{position:relative;border-radius:8px;overflow:hidden;background:var(--sunken);aspect-ratio:4/3}
.fphoto img{width:100%;height:100%;object-fit:cover;display:block}
.fphoto .st{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,26,30,.5);color:#fff;font-size:14px;text-align:center}
.fphoto .st.fail{background:rgba(160,40,20,.75)}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbtns label{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:12px 6px;font-weight:700;cursor:pointer;border:1.5px solid var(--line-strong);background:var(--surface);font-size:15px}
.fbtns label.cam{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fbtns input{position:absolute;width:1px;height:1px;opacity:0}
.missing{font-size:13px;color:#A86A00}
.donebar{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.donebar .btn{padding:14px;font-size:17px;font-weight:700}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<header class="bar"><i aria-hidden="true"></i><b id="title">巡查拍照上傳</b><span class="who" id="who"></span></header>
<main class="wrap" id="app"><div class="msg">LINE 登入中…</div></main>

<script>
(function(){
"use strict";
/* ====== 設定 ====== */
var GAS_URL = "https://script.google.com/macros/s/AKfycbyJ5IWOv6_6MPf2mQfB0BZntI0Qqoa6zU1blZPlwWNKcePQTTp3vstHRsD4Xk3-c9Ve/exec";
var LIFF_ID = "2011018188-CN7RGIY1";   // LINE Developers → 打卡系統的 LINE Login 頻道 → LIFF 新增一個，Endpoint 指到本頁

var LS="insp_m_";
var S={sess:null,name:"",meetings:[],mine:[],mid:lsGet("mid")||null,queue:[],active:0,local:{},confirmDel:null,dirty:false,mode:"shoot"};
/* 改善登錄：meetings/items 由 m_fixList 載入；local＝剛選的照片預覽；busy/fail 以「項目ID:欄位」為鍵 */
var F={loaded:false,loading:false,meetings:[],items:[],mid:lsGet("fmid")||null,id:null,filter:"todo",local:{},busy:{},fail:{}};
var app=document.getElementById("app");

function lsGet(k){try{return localStorage.getItem(LS+k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LS+k,v)}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function roc(iso){if(!iso)return"";var p=String(iso).split(/[-\/]/);return p.length<3?iso:(p[0]-1911)+"/"+p[1]+"/"+p[2]}
function todayIso(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
var toastT;function toast(m){var t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(function(){t.remove()},3000)}
function meeting(){var id=S.mid;return S.meetings.find(function(m){return m.id===id})}
function mineOf(mid){return S.mine.filter(function(d){return d.mid===mid}).sort(function(a,b){return (b.seq||0)-(a.seq||0)})}

/* ---------- 連線（逾時逐次放寬、自動重試；寫入都帶 ID，重送不會重複） ---------- */
function post(body,tmos){
  tmos=tmos||[15000,25000,40000];if(S.sess&&!body.sess)body.sess=S.sess;
  function once(i){
    var ac=typeof AbortController!=="undefined"?new AbortController():null,timer;
    var to=new Promise(function(_,rej){timer=setTimeout(function(){if(ac)try{ac.abort()}catch(e){}rej(new Error("timeout"))},tmos[i])});
    return Promise.race([fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ac?ac.signal:undefined}).then(function(r){return r.text()}),to])
      .then(function(t){clearTimeout(timer);var o=null;try{o=JSON.parse(t)}catch(e){}if(!o)throw new Error("bad-json");return o},function(e){clearTimeout(timer);throw e})
      .catch(function(e){
        if(i+1<tmos.length)return new Promise(function(r){setTimeout(r,800*(i+1))}).then(function(){return once(i+1)});
        throw new Error(navigator.onLine===false?"目前沒有網路連線":"Google 伺服器忙碌或回應太慢，請稍後再試");
      });
  }
  return once(0).then(function(o){
    if(o.err==="relogin")return login().then(function(){body.sess=S.sess;return post(body,tmos)});
    if(!o.ok){var e=new Error(o.msg||"發生錯誤");e.o=o;throw e}
    return o;
  });
}

/* ---------- LINE 登入 ---------- */
function login(){
  var tk=liff.getIDToken();
  return post({action:"m_login",idToken:tk}).then(function(r){
    S.sess=r.sess;S.name=r.name;S.meetings=r.meetings;S.mine=r.mine;
    lsSet("sess",JSON.stringify({sess:r.sess,name:r.name,at:Date.now()}));
    return r;
  });
}
function boot(){
  if(/請貼上/.test(LIFF_ID)){fatal("尚未設定 LIFF ID，請聯絡管理員。");return}
  liff.init({liffId:LIFF_ID}).then(function(){
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
    // 入口 https://liff.line.me/LIFF_ID?view=fix → 改善登錄
    var q=location.search+" "+decodeURIComponent(new URLSearchParams(location.search).get("liff.state")||"");
    S.mode=/view=fix/.test(q)?"fix":"shoot";
    var saved=null;try{saved=JSON.parse(lsGet("sess")||"null")}catch(e){}
    // 5 小時內開過就沿用 session（後端保留 6 小時），開頁更快；過期會自動重新登入
    if(saved&&saved.sess&&Date.now()-saved.at<5*3600e3){
      S.sess=saved.sess;S.name=saved.name;
      return post({action:"m_meetings"}).then(function(r){S.name=r.name;S.meetings=r.meetings;S.mine=r.mine});
    }
    return login();
  }).then(function(){if(S.sess){pickDefault();render();resumePending();if(S.mode==="fix")loadFix()}})
  .catch(function(e){
    var o=e&&e.o;
    if(o&&o.err==="not_bound")bindView(o.lineName,o.candidates||[]);
    else fatal("登入失敗："+(e&&e.message||e));
  });
}
function pickDefault(){
  if(S.mid&&!meeting())S.mid=null;
  if(!S.mid){var t=S.meetings.filter(function(m){return m.date===todayIso()});if(t.length===1)S.mid=t[0].id}   // 今天只有一場就直接進去
}
/* ---------- 第一次使用：綁定姓名（沒綁定不能上傳）---------- */
var BIND={lineName:"",list:[],pick:"",confirm:false,busy:false};
function bindView(lineName,list){
  if(lineName!==undefined){BIND.lineName=lineName||"";BIND.list=list;BIND.pick="";BIND.confirm=false}
  document.getElementById("who").textContent="";
  var h='<h1>第一次使用</h1><div class="sub">'+(BIND.lineName?esc(BIND.lineName)+'，你好！':'')+'請選擇你的姓名完成綁定，之後打開就會自動認得你。</div><div class="bind">';
  if(!BIND.list.length){
    h+='<div class="msg err" style="margin:0">名單中沒有可以綁定的姓名。請聯絡工務部，確認你已在員工名冊中（在職），或你的姓名是否已被別人綁定。</div>';
  }else if(!BIND.confirm){
    h+='<label class="field" style="margin:0"><span>我的姓名</span><select id="bind-name"><option value="">— 請選擇 —</option>'+
      BIND.list.map(function(n){return '<option'+(n===BIND.pick?' selected':'')+'>'+esc(n)+'</option>'}).join("")+'</select></label>'+
      '<button class="btn primary" data-act="bind-next" style="padding:12px;font-size:16px"'+(BIND.pick?'':' disabled')+'>下一步</button>';
  }else{
    h+='<div class="confirm">確定要把這個 LINE 綁定為 <b>'+esc(BIND.pick)+'</b> 嗎？<br><span class="sub">綁定後照片都會掛在這個名字底下；選錯要請工務部解除。</span></div>'+
      '<div class="row"><button class="btn" data-act="bind-back"'+(BIND.busy?' disabled':'')+'>重選</button><button class="btn primary" data-act="bind-ok"'+(BIND.busy?' disabled':'')+'>'+(BIND.busy?'綁定中…':'確定綁定')+'</button></div>';
  }
  app.innerHTML=h+'</div>';
}
app.addEventListener("change",function(e){if(e.target.id==="bind-name"){BIND.pick=e.target.value;bindView()}});
app.addEventListener("click",async function(e){
  var t=e.target.closest("[data-act]");if(!t)return;var a=t.dataset.act;
  if(a==="bind-next"&&BIND.pick){BIND.confirm=true;bindView()}
  else if(a==="bind-back"){BIND.confirm=false;bindView()}
  else if(a==="bind-ok"){
    BIND.busy=true;bindView();
    try{
      var r=await post({action:"m_bind",idToken:liff.getIDToken(),name:BIND.pick});
      S.sess=r.sess;S.name=r.name;S.meetings=r.meetings;S.mine=r.mine;
      lsSet("sess",JSON.stringify({sess:r.sess,name:r.name,at:Date.now()}));
      toast("綁定完成："+r.name);pickDefault();render();resumePending();if(S.mode==="fix")loadFix();
    }catch(err){
      BIND.busy=false;BIND.confirm=false;var o=err&&err.o;
      if(o&&o.candidates){BIND.list=o.candidates;BIND.pick=""}
      bindView();toast(err.message);
    }
  }
});
function fatal(msg,lineName){

/* ---------- 照片 ---------- */
function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=src})}
async function compress(file){
  var url=URL.createObjectURL(file);
  try{
    var img=await loadImg(url),max=1600,q=.82,out="";
    for(var i=0;i<10;i++){
      var s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
      c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL("image/jpeg",q);if(out.length<450000)return out;
      if(q>.56)q-=.08;else max=Math.round(max*.82);
    }
    return out;
  }finally{URL.revokeObjectURL(url)}
}
/* ---------- 未完成的上傳先存在手機（IndexedDB），傳成功才刪；頁面被關掉，下次打開自動續傳 ---------- */
var IDB=null;
function idb(){
  if(IDB)return IDB;
  IDB=new Promise(function(res){
    try{var r=indexedDB.open("insp_upload",1);
      r.onupgradeneeded=function(){r.result.createObjectStore("pending",{keyPath:"id"})};
      r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)};
    }catch(e){res(null)}
  });
  return IDB;
}
function idbDo(mode,fn){return idb().then(function(db){if(!db)return null;return new Promise(function(res){
  try{var tx=db.transaction("pending",mode),st=tx.objectStore("pending"),q=fn(st);tx.oncomplete=function(){res(q&&q.result)};tx.onerror=function(){res(null)}}catch(e){res(null)}
})})}
function idbPut(d){return idbDo("readwrite",function(st){return st.put({id:d.id,mid:d.mid,seq:d.seq,location:d.location,desc:d.desc,data:d._local})})}
function idbDel(id){return idbDo("readwrite",function(st){return st.delete(id)})}
function idbAll(){return idbDo("readonly",function(st){return st.getAll()}).then(function(x){return x||[]})}
async function resumePending(){
  var rows=await idbAll();if(!rows.length)return;
  var have={};S.mine.forEach(function(d){have[d.id]=d});
  var n=0;
  rows.forEach(function(r){
    if(r.kind==="fix"){F.local[r.defId+":"+r.slot]=r.data;S.queue.push(sendFix.bind(null,r));n++;return}
    if(have[r.id]&&!have[r.id]._pending){idbDel(r.id);return}   // 上次關掉前其實已經傳到了
    if(have[r.id])return;
    var d={id:r.id,mid:r.mid,seq:r.seq,location:r.location,desc:r.desc||"",photo:"",_pending:true,_local:r.data};
    S.mine.push(d);S.queue.push(send.bind(null,d));n++;
  });
  if(n){toast("接續上傳上次沒傳完的 "+n+" 張");pump()}
}

function pump(){
  while(S.active<2&&S.queue.length){var job=S.queue.shift();S.active++;job().catch(function(){}).then(function(){S.active--;pump();schedule()})}
  schedule();
}
async function addFiles(files){
  var m=meeting();if(!m||!files.length)return;
  var loc=(document.getElementById("loc")||{}).value||"";loc=loc.trim();lsSet("loc_"+m.id,loc);
  var seq=Date.now();
  for(var i=0;i<files.length;i++){
    var data;try{data=await compress(files[i])}catch(e){toast("有一張照片讀不出來，已略過");continue}
    var d={id:uid(),mid:m.id,seq:seq+i,location:loc,desc:"",photo:"",_pending:true,_local:data};
    S.mine.push(d);await idbPut(d);S.queue.push(send.bind(null,d));
  }
  pump();
}
async function send(d){
  d._fail=false;d._sending=true;
  try{
    var r=await post({action:"m_add",d:{id:d.id,mid:d.mid,seq:d.seq,location:d.location,desc:d.desc},photo:d._local},[40000,60000,90000]);
    var desc=d.desc;S.local[r.defect.photo]=d._local;
    Object.assign(d,{photo:r.defect.photo,_pending:false,_local:null});idbDel(d.id);
    if(d._reup){var nd=d._reup;d._reup=null;d._localEdit=nd;S.queue.push(sendEdit.bind(null,d,nd))}   // 上傳途中又標註過
    var m=S.meetings.find(function(x){return x.id===d.mid});if(m&&!r.dup)m.photos++;
    if(desc)await post({action:"m_update",id:d.id,patch:{desc:desc}});   // 上傳中就先打的說明
  }catch(e){d._fail=true;toast("照片上傳失敗："+e.message)}
  d._sending=false;
  if(!S.mine.some(function(x){return x._pending}))toast("✓ 全部上傳完成");
}

async function fixUpdate(it,patch){
  Object.assign(it,patch);

/* 選照片 → 先開標註畫面（可旋轉、圈起來，或直接按「上傳」）→ 排隊上傳 */
async function fixPick(id,key,file){
  var data;try{data=await compress(file)}catch(e){toast("照片讀不出來");return}
  edOpen({src:data,okLabel:"上傳",onSave:function(out){if(out)queueFix({id:"fix:"+id+":"+key,kind:"fix",defId:id,slot:key,data:out})}});
}
function queueFix(rec){
  var k=rec.defId+":"+rec.slot;F.local[k]=rec.data;delete F.fail[k];
  idbDo("readwrite",function(st){return st.put(rec)});
  S.queue.push(sendFix.bind(null,rec));pump();
}
async function sendFix(rec){
  var k=rec.defId+":"+rec.slot;F.busy[k]=1;delete F.fail[k];schedule();
  try{
    var r=await post({action:"m_fixPhoto",id:rec.defId,slot:rec.slot,photo:rec.data},[40000,60000,90000]);
    S.local[r.fileId]=rec.data;delete F.local[k];idbDel(rec.id);
    var it=fitem(rec.defId);
    if(it){
      it[rec.slot]=r.fileId;
      var p={};   // 上傳照片時順手帶入今天日期（沒填過才帶）
      if(rec.slot==="midPhoto"&&!it.actualDate)p.actualDate=todayIso();
      if(rec.slot==="afterPhoto"&&!it.afterDate)p.afterDate=todayIso();
      if(Object.keys(p).length)await fixUpdate(it,p);
    }
    toast((rec.slot==="midPhoto"?"改善中":"改善後")+"照片已上傳");
  }catch(e){F.fail[k]=rec;toast("照片上傳失敗："+e.message)}
  delete F.busy[k];
}

  else if(a==="freload")loadFix();

});

  if(t.dataset.ff&&t.dataset.id){var it=fitem(t.dataset.id),v=t.value.trim(),p={};if(!it||(it[t.dataset.ff]||"")===v)return;p[t.dataset.ff]=v;fixUpdate(it,p).then(function(ok){if(ok&&t.tagName==="TEXTAREA")toast("已儲存")})}
});

/* ---------- 標註編輯器：旋轉、方框／圓圈／箭頭、紅黃藍、細中粗 ---------- */
var ED=null;
var COLORS=[["#E53935","紅"],["#FDD835","黃"],["#1E88E5","藍"]];
function openEditor(d){return edOpen({d:d})}
/** o.d：巡查照片（完成後換照片）；或 o.src + o.onSave(dataURL|null)：改善照片（完成＝上傳，取消＝不上傳） */
async function edOpen(o){
  var d=o.d,src=o.src||(d&&(d._localEdit||d._local||S.local[d.photo]));
  var box=document.createElement("div");box.className="ed";box.setAttribute("role","dialog");box.setAttribute("aria-label","照片標註");
  document.body.appendChild(box);document.body.style.overflow="hidden";
  ED={d:d,src:src,onSave:o.onSave||null,okLabel:o.okLabel||"完成",box:box,shapes:[],drag:null,base:null,W:0,H:0,rotated:false,
      tool:lsGet("ed_tool")||"rect",color:lsGet("ed_color")||COLORS[0][0],w:Number(lsGet("ed_w")||2)};
  edRender(true);
  try{
    if(!src){var r=await post({action:"m_photoData",id:d.id},[30000,45000]);src="data:image/jpeg;base64,"+r.data;S.local[d.photo]=src}
    var img=await loadImg(src),c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext("2d").drawImage(img,0,0);
    if(!ED)return;ED.base=c;ED.W=c.width;ED.H=c.height;edRender();
  }catch(e){toast("讀取照片失敗："+e.message);closeEditor()}
}
function closeEditor(){if(ED){ED.box.remove();ED=null;document.body.style.overflow=""}}
function edRender(loading){
  var b=ED.box,seg=function(g,list){return '<div class="seg" data-g="'+g+'">'+list.map(function(o){return '<button data-v="'+o[0]+'" aria-pressed="'+(String(ED[g])===String(o[0]))+'" aria-label="'+o[2]+'">'+o[1]+'</button>'}).join("")+'</div>'};
  b.innerHTML='<div class="ed-top"><button data-ed="cancel">取消</button><span class="sp"></span>'+
    '<button data-ed="rot">⟳ 旋轉</button><button data-ed="undo"'+(ED.shapes.length?'':' disabled')+'>↶ 復原</button><button class="ok" data-ed="save">'+esc(ED.okLabel)+'</button></div>'+
    '<div class="ed-stage"><canvas id="edc"></canvas>'+(loading?'<div class="busy">讀取照片中…</div>':'')+'</div>'+
    '<div class="ed-tools">'+
      seg("tool",[["rect","▭ 方框","方框"],["circle","◯ 圓圈","圓圈"],["arrow","➜ 箭頭","箭頭"]])+
      seg("color",COLORS.map(function(c){return [c[0],'<span class="sw" style="background:'+c[0]+'"></span>'+c[1],c[1]]}))+
      seg("w",[[1,'<span class="lw" style="height:2px"></span>細',"細"],[2,'<span class="lw" style="height:5px"></span>中',"中"],[3,'<span class="lw" style="height:9px"></span>粗',"粗"]])+
    '</div>';
  var cv=b.querySelector("#edc");
  cv.addEventListener("pointerdown",edDown);cv.addEventListener("pointermove",edMove);cv.addEventListener("pointerup",edUp);cv.addEventListener("pointercancel",edUp);
  edDraw();
}
function edDraw(){
  if(!ED||!ED.base)return;var cv=ED.box.querySelector("#edc");cv.width=ED.W;cv.height=ED.H;
  var x=cv.getContext("2d");x.drawImage(ED.base,0,0);
  ED.shapes.concat(ED.drag?[ED.drag]:[]).forEach(function(s){edShape(x,s)});
}
function edLw(w){var u=Math.max(ED.W,ED.H)/300;return u*(w===1?2:w===3?7:4)}
function edShape(x,s){
  var lw=edLw(s.w);x.save();x.strokeStyle=s.color;x.fillStyle=s.color;x.lineWidth=lw;x.lineCap="round";x.lineJoin="round";
  x.shadowColor="rgba(0,0,0,.45)";x.shadowBlur=lw*.8;   // 黃色標在亮處也看得清楚
  var x1=s.x1,y1=s.y1,x2=s.x2,y2=s.y2;
  if(s.tool==="rect"){x.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1))}
  else if(s.tool==="circle"){x.beginPath();x.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,0,Math.PI*2);x.stroke()}
  else{
    var a=Math.atan2(y2-y1,x2-x1),hl=Math.max(lw*3.2,Math.max(ED.W,ED.H)/40),hw=hl*.6;
    var bx=x2-Math.cos(a)*hl*.85,by=y2-Math.sin(a)*hl*.85;
    x.beginPath();x.moveTo(x1,y1);x.lineTo(bx,by);x.stroke();
    x.beginPath();x.moveTo(x2,y2);x.lineTo(x2-Math.cos(a)*hl+Math.sin(a)*hw,y2-Math.sin(a)*hl-Math.cos(a)*hw);
    x.lineTo(x2-Math.cos(a)*hl-Math.sin(a)*hw,y2-Math.sin(a)*hl+Math.cos(a)*hw);x.closePath();x.fill();
  }
  x.restore();
}
function edPt(e){var cv=e.target,r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*ED.W/r.width,y:(e.clientY-r.top)*ED.H/r.height}}
function edDown(e){if(!ED||!ED.base)return;e.preventDefault();try{e.target.setPointerCapture(e.pointerId)}catch(err){}var p=edPt(e);ED.drag={tool:ED.tool,color:ED.color,w:ED.w,x1:p.x,y1:p.y,x2:p.x,y2:p.y}}
function edMove(e){if(!ED||!ED.drag)return;var p=edPt(e);ED.drag.x2=p.x;ED.drag.y2=p.y;edDraw()}
function edUp(){
  if(!ED||!ED.drag)return;var s=ED.drag;ED.drag=null;
  if(Math.hypot(s.x2-s.x1,s.y2-s.y1)>Math.max(ED.W,ED.H)/60)ED.shapes.push(s);   // 太小當作誤觸
  edRender();
}
function edRotate(){   // 順時針 90°，已畫的標註跟著轉
  var o=ED.base,c=document.createElement("canvas");c.width=o.height;c.height=o.width;
  var x=c.getContext("2d");x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(o,0,0);
  var H=o.height;ED.shapes.forEach(function(s){var a=[H-s.y1,s.x1],b=[H-s.y2,s.x2];s.x1=a[0];s.y1=a[1];s.x2=b[0];s.y2=b[1]});
  ED.base=c;ED.W=c.width;ED.H=c.height;ED.rotated=true;edRender();
}
function edSave(){
  var d=ED.d,changed=ED.shapes.length||ED.rotated;
  if(ED.onSave&&!changed){var cb0=ED.onSave,src0=ED.src;closeEditor();cb0(src0);return}   // 沒標註也照樣上傳
  if(!changed){closeEditor();return}
  var cv=ED.box.querySelector("#edc"),q=.86,out=cv.toDataURL("image/jpeg",q);
  while(out.length>450000&&q>.5){q-=.08;out=cv.toDataURL("image/jpeg",q)}
  if(ED.onSave){var cb=ED.onSave;closeEditor();cb(out);return}
  closeEditor();
  if(d._pending){             // 還沒上傳完：直接換掉要上傳的照片
    if(d._sending)d._reup=out;
    d._local=out;idbPut(d);render();return;
  }
  d._localEdit=out;S.queue.push(sendEdit.bind(null,d,out));pump();
}
async function sendEdit(d,data){
  d._busy=true;d._editFail=null;schedule();
  try{var r=await post({action:"m_photo",id:d.id,photo:data},[40000,60000,90000]);S.local[r.fileId]=data;d.photo=r.fileId;d._localEdit=null;toast("標註已儲存")}
  catch(e){d._editFail=data;toast("標註上傳失敗："+e.message)}
  finally{d._busy=false}
}
document.addEventListener("click",function(e){
  if(!ED)return;var t=e.target.closest("button");if(!t||!ED.box.contains(t))return;
  var g=t.parentNode.dataset&&t.parentNode.dataset.g;
  if(g){var v=g==="w"?Number(t.dataset.v):t.dataset.v;ED[g]=v;lsSet("ed_"+g,v);edRender();return}
  var a=t.dataset.ed;
  if(a==="cancel"){var cb=ED.onSave;closeEditor();if(cb)cb(null)}
  else if(a==="undo"){ED.shapes.pop();edRender()}
  else if(a==="rot"){if(ED.base)edRotate()}
  else if(a==="save"){if(ED.base)edSave()}
});

/* ---------- 事件 ---------- */
app.addEventListener("click",async function(e){
  var t=e.target.closest("[data-act]");if(!t)return;var a=t.dataset.act,id=t.dataset.id;
  if(a==="open"){S.mid=id;lsSet("mid",id);render();scrollTo(0,0)}
  else if(a==="list"){S.mid=null;lsSet("mid","");S.confirmDel=null;render();scrollTo(0,0)}
  else if(a==="retry"){var d=S.mine.find(function(x){return x.id===id});if(d){S.queue.push(send.bind(null,d));pump()}}
  else if(a==="edit"){var de=S.mine.find(function(x){return x.id===id});if(de)openEditor(de)}
  else if(a==="retry-edit"){var dr=S.mine.find(function(x){return x.id===id});if(dr&&dr._editFail){var dd=dr._editFail;dr._editFail=null;S.queue.push(sendEdit.bind(null,dr,dd));pump()}}
  else if(a==="del"){S.confirmDel=id;render()}
  else if(a==="del-no"){S.confirmDel=null;render()}
  else if(a==="del-yes"){
    S.confirmDel=null;var keep=S.mine.slice();S.mine=S.mine.filter(function(x){return x.id!==id});render();
    try{await post({action:"m_delete",id:id});var m=meeting();if(m)m.photos=Math.max(0,m.photos-1);toast("已刪除");render()}
    catch(err){S.mine=keep;toast("刪除失敗："+err.message);render()}
  }
});
app.addEventListener("change",async function(e){
  var t=e.target;
  if(t.id==="loc"){var m=meeting();if(m)lsSet("loc_"+m.id,t.value.trim());return}
  if(t.id==="cam"||t.id==="alb"){var fs=[].slice.call(t.files);t.value="";addFiles(fs);return}
  if(t.tagName==="TEXTAREA"&&t.dataset.id){
    var d=S.mine.find(function(x){return x.id===t.dataset.id}),v=t.value.trim();if(!d||d.desc===v)return;
    d.desc=v;if(d._pending){idbPut(d);return}   // 還在上傳，上傳完會一起送
    try{await post({action:"m_update",id:d.id,patch:{desc:v}});toast("已儲存說明")}catch(err){toast("儲存失敗："+err.message)}
  }
});
window.addEventListener("beforeunload",function(e){if(S.active||S.queue.length){e.preventDefault();e.returnValue="照片還在上傳"}});

boot();
})();
</script>
