<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>巡查拍照上傳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --ground:#EDEFEC; --surface:#FFFFFF; --sunken:#E3E6E2; --ink:#1C2630; --ink-2:#4A5560; --ink-3:#7A848C;
  --line:#CDD2CE; --line-strong:#AEB5B0;
  --accent:#E8A900; --accent-ink:#1C2630; --accent-soft:#FBF0CC;
  --bad:#B8402A; --bad-soft:#F6E1DC; --ok:#2F7A4E; --ok-soft:#DDEFE3;
  --focus:#2C6FB7;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#151B20; --surface:#1E262D; --sunken:#11161A; --ink:#E6EAE7; --ink-2:#B2BAB6; --ink-3:#86908C;
    --line:#2F3A42; --line-strong:#46525B;
    --accent:#F2B705; --accent-ink:#151B20; --accent-soft:#3A3113;
    --bad:#E27A63; --bad-soft:#3B221D; --ok:#6CC08F; --ok-soft:#1C3325;
    --focus:#79AEEA;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--ground);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar{background:var(--sunken);color:var(--ink)}}
.bar i{width:20px;height:20px;flex:none;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,var(--ink) 5px 10px);border-radius:3px;border:1.5px solid var(--accent)}
.bar b{font-weight:700;letter-spacing:.04em}
.bar .who{margin-left:auto;font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font-size:21px;margin:4px 0 2px;line-height:1.3}
.sub{color:var(--ink-2);font-size:14px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;margin-top:24px;display:flex;flex-direction:column;gap:12px;align-items:center}
.msg.err{border-color:var(--bad);background:var(--bad-soft)}

.mlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.mbtn{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.mbtn:active{background:var(--accent-soft)}
.mbtn .d{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.mbtn .s{font-size:19px;font-weight:700}
.mbtn .p{font-size:13px;color:var(--ink-3);grid-column:1}
.mbtn .n{grid-row:1/4;grid-column:2;text-align:right;font-size:13px;color:var(--ink-2)}
.mbtn .n b{display:block;font-family:var(--mono);font-size:22px;color:var(--ink)}
.today{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;margin-left:6px;vertical-align:2px}

.back{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:14px}
.field span{font-size:13px;color:var(--ink-3)}
.field input,.field textarea{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:16px}
.shoot{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:14px}
.shoot label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;padding:18px 8px;font-weight:700;cursor:pointer;min-height:92px;text-align:center}
.shoot label small{font-weight:400;font-size:12px}
.shoot .cam{background:var(--accent);color:var(--accent-ink);font-size:19px}
.shoot .alb{background:var(--surface);border:1.5px solid var(--line-strong);font-size:16px}
.shoot .ico{font-size:28px;line-height:1}
.shoot input{position:absolute;width:1px;height:1px;opacity:0}
.hint{font-size:13px;color:var(--ink-3);margin-top:8px}

.mine-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 8px;border-top:2px solid var(--ink);padding-top:10px}
.mine-h h2{font-size:16px;margin:0}
.item{display:grid;grid-template-columns:108px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.thumb{position:relative;width:108px;height:108px;border-radius:8px;overflow:hidden;background:var(--sunken)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .st{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,26,30,.5);color:#fff;font-size:13px;font-weight:500;text-align:center;padding:4px}
.thumb .st.fail{background:rgba(160,40,20,.75)}
.item .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.item .loc{font-size:13px;color:var(--ink-2)}
.item textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:15px;resize:vertical;min-height:54px}
.item .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.tag{background:var(--ok-soft);color:var(--ok);padding:0 8px;border-radius:999px;font-size:12px;font-weight:500}
.lnk{background:none;border:0;padding:0;color:var(--ink-3);text-decoration:underline;cursor:pointer;font-size:13px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.empty{color:var(--ink-3);font-size:14px;text-align:center;padding:18px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<header class="bar"><i aria-hidden="true"></i><b>巡查拍照上傳</b><span class="who" id="who"></span></header>
<main class="wrap" id="app"><div class="msg">LINE 登入中…</div></main>

<script>
(function(){
"use strict";
/* ====== 設定 ====== */
var GAS_URL = "https://script.google.com/macros/s/AKfycbyJ5IWOv6_6MPf2mQfB0BZntI0Qqoa6zU1blZPlwWNKcePQTTp3vstHRsD4Xk3-c9Ve/exec";
var LIFF_ID = "2011018188-CN7RGIY1";   // LINE Developers → 打卡系統的 LINE Login 頻道 → LIFF 新增一個，Endpoint 指到本頁

var LS="insp_m_";
var S={sess:null,name:"",meetings:[],mine:[],mid:lsGet("mid")||null,queue:[],active:0,local:{},confirmDel:null,dirty:false};
var app=document.getElementById("app");

function lsGet(k){try{return localStorage.getItem(LS+k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LS+k,v)}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function roc(iso){if(!iso)return"";var p=String(iso).split(/[-\/]/);return p.length<3?iso:(p[0]-1911)+"/"+p[1]+"/"+p[2]}
function todayIso(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
var toastT;function toast(m){var t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(function(){t.remove()},3000)}
function meeting(){var id=S.mid;return S.meetings.find(function(m){return m.id===id})}
function mineOf(mid){return S.mine.filter(function(d){return d.mid===mid}).sort(function(a,b){return (b.seq||0)-(a.seq||0)})}

/* ---------- 連線（逾時逐次放寬、自動重試；寫入都帶 ID，重送不會重複） ---------- */
function post(body,tmos){
  tmos=tmos||[15000,25000,40000];if(S.sess&&!body.sess)body.sess=S.sess;
  function once(i){
    var ac=typeof AbortController!=="undefined"?new AbortController():null,timer;
    var to=new Promise(function(_,rej){timer=setTimeout(function(){if(ac)try{ac.abort()}catch(e){}rej(new Error("timeout"))},tmos[i])});
    return Promise.race([fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ac?ac.signal:undefined}).then(function(r){return r.text()}),to])
      .then(function(t){clearTimeout(timer);var o=null;try{o=JSON.parse(t)}catch(e){}if(!o)throw new Error("bad-json");return o},function(e){clearTimeout(timer);throw e})
      .catch(function(e){
        if(i+1<tmos.length)return new Promise(function(r){setTimeout(r,800*(i+1))}).then(function(){return once(i+1)});
        throw new Error(navigator.onLine===false?"目前沒有網路連線":"Google 伺服器忙碌或回應太慢，請稍後再試");
      });
  }
  return once(0).then(function(o){
    if(o.err==="relogin")return login().then(function(){body.sess=S.sess;return post(body,tmos)});
    if(!o.ok){var e=new Error(o.msg||"發生錯誤");e.o=o;throw e}
    return o;
  });
}

/* ---------- LINE 登入 ---------- */
function login(){
  var tk=liff.getIDToken();
  return post({action:"m_login",idToken:tk}).then(function(r){
    S.sess=r.sess;S.name=r.name;S.meetings=r.meetings;S.mine=r.mine;
    lsSet("sess",JSON.stringify({sess:r.sess,name:r.name,at:Date.now()}));
    return r;
  });
}
function boot(){
  if(/請貼上/.test(LIFF_ID)){fatal("尚未設定 LIFF ID，請聯絡管理員。");return}
  liff.init({liffId:LIFF_ID}).then(function(){
    if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return}
    var saved=null;try{saved=JSON.parse(lsGet("sess")||"null")}catch(e){}
    // 5 小時內開過就沿用 session（後端保留 6 小時），開頁更快；過期會自動重新登入
    if(saved&&saved.sess&&Date.now()-saved.at<5*3600e3){
      S.sess=saved.sess;S.name=saved.name;
      return post({action:"m_meetings"}).then(function(r){S.name=r.name;S.meetings=r.meetings;S.mine=r.mine});
    }
    return login();
  }).then(function(){if(S.sess){pickDefault();render()}})
  .catch(function(e){
    var o=e&&e.o;
    if(o&&o.err==="not_bound")fatal(o.msg,o.lineName);
    else fatal("登入失敗："+(e&&e.message||e));
  });
}
function pickDefault(){
  if(S.mid&&!meeting())S.mid=null;
  if(!S.mid){var t=S.meetings.filter(function(m){return m.date===todayIso()});if(t.length===1)S.mid=t[0].id}   // 今天只有一場就直接進去
}
function fatal(msg,lineName){
  app.innerHTML='<div class="msg err">'+(lineName?'<b>'+esc(lineName)+'，你好</b>':'')+'<span>'+esc(msg)+'</span><button class="btn" onclick="location.reload()">重新整理</button></div>';
}

/* ---------- 畫面 ---------- */
function schedule(){
  var a=document.activeElement;
  if(a&&app.contains(a)&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type==="text"))){S.dirty=true;return}
  render();
}
app.addEventListener("focusout",function(){setTimeout(function(){if(S.dirty){S.dirty=false;render()}},0)});
function render(){
  document.getElementById("who").textContent=S.name?S.name:"";
  var m=meeting();
  app.innerHTML=m?meetingView(m):listView();
}
function listView(){
  if(!S.meetings.length)return '<h1>選擇工務會議</h1><div class="msg">目前沒有進行中的工務會議。<span class="sub">請工務部先在系統建立本次會議。</span><button class="btn" onclick="location.reload()">重新整理</button></div>';
  var t=todayIso();
  return '<h1>選擇工務會議</h1><div class="sub">'+esc(S.name)+'，今天要上傳哪一場的巡查照片？</div><div class="mlist">'+
    S.meetings.map(function(m){
      var my=S.mine.filter(function(d){return d.mid===m.id}).length;
      return '<button class="mbtn" data-act="open" data-id="'+esc(m.id)+'"><span class="d">'+esc(roc(m.date))+(m.date===t?'<span class="today">今天</span>':'')+'</span>'+
        '<span class="s">'+esc(m.site)+'</span><span class="p">'+esc(m.project)+'</span>'+
        '<span class="n">我拍的<b>'+my+'</b>全部 '+m.photos+' 張</span></button>';
    }).join("")+'</div>';
}
function meetingView(m){
  var list=mineOf(m.id),loc=lsGet("loc_"+m.id)||"";
  return '<button class="back" data-act="list">← 換一場會議</button>'+
    '<h1>'+esc(m.site)+'</h1><div class="sub"><span class="mono">'+esc(roc(m.date))+'</span>　'+esc(m.project)+'</div>'+
    '<label class="field"><span>現在位置（新照片會自動帶入）</span><input type="text" id="loc" value="'+esc(loc)+'" placeholder="例：IL棟 1F 廚房區" enterkeyhint="done"></label>'+
    '<div class="shoot"><label class="cam"><span class="ico" aria-hidden="true">📷</span>拍照<small>開相機</small><input type="file" accept="image/*" capture="environment" id="cam"></label>'+
    '<label class="alb"><span class="ico" aria-hidden="true">🖼</span>從相簿選<small>可一次選多張</small><input type="file" accept="image/*" multiple id="alb"></label></div>'+
    '<div class="hint">照片會自動壓縮後上傳。缺失說明可以之後再補，會議報告前寫好就行。</div>'+
    '<div class="mine-h"><h2>我在這場上傳的照片</h2><span class="sub">'+list.length+' 張'+(S.active+S.queue.length?'・上傳中 '+(S.active+S.queue.length):'')+'</span></div>'+
    (list.length?list.map(itemView).join(""):'<div class="empty">還沒有照片，按上面「拍照」開始。</div>');
}
function itemView(d){
  var src=d._local||S.local[d.photo]||(d.photo?"https://drive.google.com/thumbnail?id="+encodeURIComponent(d.photo)+"&sz=w300":"");
  var st=d._pending?(d._fail?'<span class="st fail">上傳失敗<br><button class="btn" data-act="retry" data-id="'+esc(d.id)+'">重試</button></span>':'<span class="st">上傳中…</span>'):"";
  var del=d._pending||d.selected?"":(S.confirmDel===d.id?'<span>刪除？<button class="btn danger" data-act="del-yes" data-id="'+esc(d.id)+'">刪除</button> <button class="btn" data-act="del-no">取消</button></span>':'<button class="lnk" data-act="del" data-id="'+esc(d.id)+'">刪除</button>');
  return '<div class="item"><div class="thumb">'+(src?'<img src="'+esc(src)+'" alt="" referrerpolicy="no-referrer">':'')+st+'</div>'+
    '<div class="body"><span class="loc">'+esc(d.location||"（未填位置）")+'</span>'+
    '<textarea data-id="'+esc(d.id)+'" rows="2" placeholder="缺失說明，例：斜撐圓管未固定">'+esc(d.desc)+'</textarea>'+
    '<div class="foot">'+(d.selected?'<span class="tag">會議已列入改善</span>':'<span></span>')+del+'</div></div></div>';
}

/* ---------- 照片 ---------- */
function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=src})}
async function compress(file){
  var url=URL.createObjectURL(file);
  try{
    var img=await loadImg(url),max=1600,q=.82,out="";
    for(var i=0;i<10;i++){
      var s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
      c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL("image/jpeg",q);if(out.length<450000)return out;
      if(q>.56)q-=.08;else max=Math.round(max*.82);
    }
    return out;
  }finally{URL.revokeObjectURL(url)}
}
function pump(){
  while(S.active<2&&S.queue.length){var job=S.queue.shift();S.active++;job().catch(function(){}).then(function(){S.active--;pump();schedule()})}
  schedule();
}
async function addFiles(files){
  var m=meeting();if(!m||!files.length)return;
  var loc=(document.getElementById("loc")||{}).value||"";loc=loc.trim();lsSet("loc_"+m.id,loc);
  var seq=Date.now();
  for(var i=0;i<files.length;i++){
    var data;try{data=await compress(files[i])}catch(e){toast("有一張照片讀不出來，已略過");continue}
    var d={id:uid(),mid:m.id,seq:seq+i,location:loc,desc:"",photo:"",_pending:true,_local:data};
    S.mine.push(d);S.queue.push(send.bind(null,d));
  }
  pump();
}
async function send(d){
  d._fail=false;
  try{
    var r=await post({action:"m_add",d:{id:d.id,mid:d.mid,seq:d.seq,location:d.location,desc:d.desc},photo:d._local},[40000,60000,90000]);
    var desc=d.desc;S.local[r.defect.photo]=d._local;
    Object.assign(d,{photo:r.defect.photo,_pending:false,_local:null});
    var m=S.meetings.find(function(x){return x.id===d.mid});if(m&&!r.dup)m.photos++;
    if(desc)await post({action:"m_update",id:d.id,patch:{desc:desc}});   // 上傳中就先打的說明
  }catch(e){d._fail=true;toast("照片上傳失敗："+e.message)}
}

/* ---------- 事件 ---------- */
app.addEventListener("click",async function(e){
  var t=e.target.closest("[data-act]");if(!t)return;var a=t.dataset.act,id=t.dataset.id;
  if(a==="open"){S.mid=id;lsSet("mid",id);render();scrollTo(0,0)}
  else if(a==="list"){S.mid=null;lsSet("mid","");S.confirmDel=null;render();scrollTo(0,0)}
  else if(a==="retry"){var d=S.mine.find(function(x){return x.id===id});if(d){S.queue.push(send.bind(null,d));pump()}}
  else if(a==="del"){S.confirmDel=id;render()}
  else if(a==="del-no"){S.confirmDel=null;render()}
  else if(a==="del-yes"){
    S.confirmDel=null;var keep=S.mine.slice();S.mine=S.mine.filter(function(x){return x.id!==id});render();
    try{await post({action:"m_delete",id:id});var m=meeting();if(m)m.photos=Math.max(0,m.photos-1);toast("已刪除");render()}
    catch(err){S.mine=keep;toast("刪除失敗："+err.message);render()}
  }
});
app.addEventListener("change",async function(e){
  var t=e.target;
  if(t.id==="loc"){var m=meeting();if(m)lsSet("loc_"+m.id,t.value.trim());return}
  if(t.id==="cam"||t.id==="alb"){var fs=[].slice.call(t.files);t.value="";addFiles(fs);return}
  if(t.tagName==="TEXTAREA"&&t.dataset.id){
    var d=S.mine.find(function(x){return x.id===t.dataset.id}),v=t.value.trim();if(!d||d.desc===v)return;
    d.desc=v;if(d._pending)return;   // 還在上傳，上傳完會一起送
    try{await post({action:"m_update",id:d.id,patch:{desc:v}});toast("已儲存說明")}catch(err){toast("儲存失敗："+err.message)}
  }
});
window.addEventListener("beforeunload",function(e){if(S.active||S.queue.length){e.preventDefault();e.returnValue="照片還在上傳"}});

boot();
})();
</script>
</body>
</html>
