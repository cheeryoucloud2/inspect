<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工務會議缺失巡查</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --ground:#EDEFEC; --surface:#FFFFFF; --sunken:#E3E6E2; --ink:#1C2630; --ink-2:#4A5560; --ink-3:#7A848C;
  --line:#CDD2CE; --line-strong:#AEB5B0;
  --accent:#E8A900; --accent-ink:#1C2630; --accent-soft:#FBF0CC;
  --bad:#B8402A; --bad-soft:#F6E1DC; --ok:#2F7A4E; --ok-soft:#DDEFE3; --wip:#A86A00; --wip-soft:#FBEBCB;
  --focus:#2C6FB7;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#151B20; --surface:#1E262D; --sunken:#11161A; --ink:#E6EAE7; --ink-2:#B2BAB6; --ink-3:#86908C;
    --line:#2F3A42; --line-strong:#46525B;
    --accent:#F2B705; --accent-ink:#151B20; --accent-soft:#3A3113;
    --bad:#E27A63; --bad-soft:#3B221D; --ok:#6CC08F; --ok-soft:#1C3325; --wip:#E5A83A; --wip-soft:#3A2D14;
    --focus:#79AEEA;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#151B20; --surface:#1E262D; --sunken:#11161A; --ink:#E6EAE7; --ink-2:#B2BAB6; --ink-3:#86908C;
  --line:#2F3A42; --line-strong:#46525B;
  --accent:#F2B705; --accent-ink:#151B20; --accent-soft:#3A3113;
  --bad:#E27A63; --bad-soft:#3B221D; --ok:#6CC08F; --ok-soft:#1C3325; --wip:#E5A83A; --wip-soft:#3A2D14;
  --focus:#79AEEA;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--ground);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
:root[data-theme="dark"] .bar{background:var(--sunken);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar{background:var(--sunken);color:var(--ink)}}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em;cursor:pointer;background:none;border:0;padding:0}
.brand i{width:22px;height:22px;display:inline-block;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,var(--ink) 5px 10px);border-radius:3px;border:1.5px solid var(--accent)}
.me{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;opacity:.9}
.me input{width:7.5em;background:transparent;border:1px solid currentColor;border-radius:6px;padding:3px 8px;color:inherit;opacity:.95}

h1{font-size:24px;line-height:1.25;margin:22px 0 4px;text-wrap:balance}
h2{font-size:17px;margin:0}
.sub{color:var(--ink-2);font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--ink-3);font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink-2);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 9px;min-width:0}
.field textarea{resize:vertical;min-height:58px}
.field input:hover,.field textarea:hover,.field select:hover{border-color:var(--line-strong)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.none{background:var(--bad-soft);color:var(--bad)}
.pill.wip{background:var(--wip-soft);color:var(--wip)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.sample{background:var(--sunken);color:var(--ink-3)}

.notice{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:14px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

/* home */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.newform{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px;display:grid;grid-template-columns:150px 1fr 2fr auto;gap:10px;align-items:end}
@media (max-width:760px){.newform{grid-template-columns:1fr 1fr}.newform .field.wide{grid-column:1/-1}.newform .btn{grid-column:1/-1}}
.mlist{margin-top:18px;border-top:2px solid var(--ink)}
.mrow{display:grid;grid-template-columns:48px 108px 1fr 190px 150px;gap:14px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.mrow:hover{background:var(--surface)}
.mrow .no{color:var(--ink-3);font-size:13px}
.mrow .date{font-size:15px;font-weight:600}
.mrow .site{font-weight:700}
.mrow .proj{font-size:13px;color:var(--ink-2)}
.prog{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2)}
.prog .track{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.prog .track b{display:block;height:100%;background:var(--ok)}
@media (max-width:760px){
  .mrow{grid-template-columns:1fr auto;gap:4px 12px}
  .mrow .no{display:none}
  .mrow .date{grid-row:1}
  .mrow .who{grid-column:1/-1;grid-row:2}
  .mrow .prog{grid-column:1/-1;grid-row:3}
  .mrow .st{grid-row:1;grid-column:2;justify-self:end}
}
.empty{padding:36px 16px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line-strong);border-radius:10px;margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:12px}

/* meeting */
.back{margin-top:16px}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:15;background:var(--ground);display:flex;gap:0;margin:16px -16px 0;padding:0 16px;border-bottom:1px solid var(--line-strong);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 9px;cursor:pointer;font-weight:500;color:var(--ink-2);white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab .step{font-family:var(--mono);font-size:12px;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:inline-grid;place-items:center}
.tab .cnt{font-family:var(--mono);font-size:12px;background:var(--sunken);padding:0 7px;border-radius:999px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .step{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{padding-top:16px}
.panel-intro{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel-intro p{margin:0;color:var(--ink-2);font-size:14px;max-width:60ch}

.drop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:10px;padding:14px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .field{flex:1 1 220px}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ph{position:relative;aspect-ratio:4/3;background:var(--sunken);display:block;width:100%;border:0;padding:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ph-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:13px}
.ph .by{position:absolute;left:8px;bottom:8px;background:rgba(20,26,30,.72);color:#fff;font-size:12px;padding:1px 8px;border-radius:4px}
.ph .num{position:absolute;left:8px;top:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-weight:600;font-size:13px;padding:1px 8px;border-radius:4px}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.selbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);padding:10px 12px;cursor:pointer;font-weight:700;text-align:left}
.selbtn .box{width:22px;height:22px;border:2px solid var(--line-strong);border-radius:5px;display:grid;place-items:center;flex:none}
.card.sel .selbtn{background:var(--accent-soft)}
.card.sel .selbtn .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.desc{font-size:14px}
.desc b{font-weight:700}
.desc .loc{color:var(--ink-2);font-size:13px}

/* tracking */
.items{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;border-left:5px solid var(--wip)}
.item.done{border-left-color:var(--ok)}
.item-h{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item-h .n{font-family:var(--mono);font-weight:600;font-size:18px}
.item-h .t{font-weight:700;flex:1 1 240px;min-width:0}
.item-h .t small{display:block;font-weight:400;color:var(--ink-2);font-size:13px}
.stages{display:grid;grid-template-columns:repeat(3,1fr)}
.stage{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line);min-width:0}
.stage:last-child{border-right:0}
.stage .lbl{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--ink-2)}
.slot{position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--sunken)}
.slot img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.slot label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--ink-2);font-size:13px;border:1.5px dashed var(--line-strong);border-radius:6px}
.slot label:hover{border-color:var(--accent);color:var(--ink)}
.slot input{position:absolute;width:1px;height:1px;opacity:0}
.slot .swap{position:absolute;right:6px;bottom:6px;inset:auto 6px 6px auto;width:auto;height:auto;border:0;background:rgba(20,26,30,.72);color:#fff;padding:2px 8px;border-radius:4px;font-size:12px}
.kv{font-size:13.5px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;color:var(--ink-2)}
.kv b{color:var(--ink);font-weight:500}
.missing{font-size:12.5px;color:var(--wip)}
.donebtn{margin-left:auto}
@media (max-width:820px){.stages{grid-template-columns:1fr}.stage{border-right:0;border-bottom:1px solid var(--line)}.stage:last-child{border-bottom:0}}
.signbox{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.signbox label{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.signbox input{width:18px;height:18px;accent-color:var(--ok)}

.confirm{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--bad)}
/* 標註編輯器 */
.ed{position:fixed;inset:0;z-index:70;background:#111417;color:#fff;display:flex;flex-direction:column}
.ed-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
.ed-top .sp{flex:1}
.ed button{font:inherit;color:#fff;background:#2A3137;border:1px solid #3A434B;border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer;white-space:nowrap}
.ed button:disabled{opacity:.4;cursor:default}
.ed button.ok{background:#E8A900;border-color:#E8A900;color:#1C2630;font-weight:700}
.ed-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px;position:relative}
.ed-stage canvas{max-width:100%;max-height:100%;touch-action:none;display:block;box-shadow:0 0 0 1px #333;cursor:crosshair}
.ed-tools{display:flex;flex-direction:column;gap:8px;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));width:100%;max-width:760px;margin:0 auto}
.seg{display:flex;gap:6px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:6px}
.seg button[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff;font-weight:700}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid #fff;display:inline-block}
.lw{display:inline-block;width:28px;border-radius:4px;background:currentColor}
.ed-info{display:flex;align-items:center;gap:10px;padding:0 12px 6px;flex-wrap:wrap;font-size:14px;color:#cfd6d2}
.ed-info .t{flex:1 1 200px;min-width:0}
.ed-info .t b{color:#fff}
.ed-info .cnt{font-family:var(--mono);color:#fff}
.ed button.sel{background:#E8A900;border-color:#E8A900;color:#1C2630;font-weight:700}
.ed button.nav{font-size:18px;padding:6px 14px}
.ed .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.6);font-size:15px}
.lightbox{position:fixed;inset:0;background:rgba(10,14,17,.9);z-index:50;display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.uploading{font-size:13px;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.card,.item{transition:box-shadow .15s,border-color .15s}}
</style>

</head>
<body>
<style>
/* 正式版追加 */
.pending{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,26,30,.45);color:#fff;font-size:13px;font-weight:500}
.pending.fail{background:rgba(160,40,20,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pending .acts{display:flex;gap:8px}
.pending .btn{color:var(--ink);background:#fff;border-color:#fff}   /* 紅底上的白色按鈕，字要看得到 */
.pending .btn.danger{color:#fff;background:transparent;border-color:#fff}
.slowtip{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);background:var(--wip-soft);color:var(--wip);border:1px solid var(--wip);padding:5px 14px;border-radius:999px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.gate{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px}
.meta-edit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;display:grid;grid-template-columns:150px 1fr 2fr;gap:10px;align-items:end}
.meta-edit .acts{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:760px){.meta-edit{grid-template-columns:1fr}}
.saved{margin-top:12px;font-size:14px}
.saved a{color:var(--focus)}
.sync{font-size:12px;opacity:.75}
.home-acts{display:flex;gap:8px;flex-wrap:wrap}
</style>

<div class="wrap" id="app"></div>
<datalist id="dl-sites"></datalist>
<datalist id="dl-people"></datalist>
<datalist id="dl-loc"></datalist>

<script>
(function(){
"use strict";
/* ====== 設定：貼上 Apps Script 部署後的 /exec 網址 ====== */
var GAS_URL = "https://script.google.com/macros/s/AKfycbyJ5IWOv6_6MPf2mQfB0BZntI0Qqoa6zU1blZPlwWNKcePQTTp3vstHRsD4Xk3-c9Ve/exec";
var APP_VERSION = "2026-09-23-01";

var LS = "insp_";
var S = {
  meetings:[], defects:[], people:[], cats:[], sites:[], ver:null, loaded:false, offline:false,
  view:"home", mid:null, tab:"shoot", filter:"all",
  me: lsGet("me") || "", token: lsGet("token") || "", lastLoc: "",
  local: new Map(),      // fileId 或 暫存鍵 → 本機 dataURL（剛上傳的照片先用本機的，不等雲端縮圖）
  queue: [], active: 0, inflight: 0, dirty:false,
  confirmDel:null, lightbox:null, showNew:false, editMeta:false, needLogin:!lsGet("token"), loggingIn:false, saved:null, exporting:false,
};
var app = document.getElementById("app");

/* ---------- helpers ---------- */
function lsGet(k){try{return localStorage.getItem(LS+k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LS+k,v)}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function roc(iso){if(!iso)return"";var p=String(iso).split(/[-\/]/);return p.length<3?iso:(p[0]-1911)+"/"+p[1]+"/"+p[2]}
function rocDot(iso){return roc(iso).replace(/\//g,".")}
function todayIso(){var d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function pad2(n){return String(n).padStart(2,"0")}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
var toastT;
function toast(msg){var t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(function(){t.remove()},3000)}
function meeting(id){return S.meetings.find(function(m){return m.id===id})}
function defectsOf(mid){return S.defects.filter(function(d){return d.mid===mid}).sort(function(a,b){return (a.seq||0)-(b.seq||0)})}
function selectedOf(mid){return defectsOf(mid).filter(function(d){return d.selected})}
function stats(mid){var ds=defectsOf(mid),sel=ds.filter(function(d){return d.selected}),done=sel.filter(function(d){return d.done});return{photos:ds.length,sel:sel.length,done:done.length}}
function status(m,st){
  if(m.skip) return ["sample","專案管理不必列缺失"];
  if(m.signed) return ["ok","○ 繳交紙本完成"];
  if(st.sel) return st.done===st.sel?["ok","● 待簽名繳交"]:["wip","● 進行改善中"];
  if(st.photos) return ["wip","● 待會議勾選"];
  return ["none","▲ 未提供建檔"];
}
function missingOf(d){var r=[];if(!d.actualDate)r.push("實際改善日期");if(!d.method)r.push("改善作法");if(!d.afterPhoto)r.push("改善後照片");if(!d.prevent)r.push("矯正預防措施");return r}

/* ---------- 連線（沿用打卡系統的做法：逾時逐次放寬、自動重試） ----------
   本系統所有寫入都帶前端產生的 ID 或是「設定欄位值」，重送不會多出一筆，所以寫入也可以安全重試。 */
var SLOW=0;
function slowTip(on){
  SLOW+=on?1:-1;var el=document.querySelector(".slowtip");
  if(SLOW<=0){SLOW=0;if(el)el.remove();return}
  if(!el){el=document.createElement("div");el.className="slowtip";document.body.appendChild(el)}
  el.textContent="Google 伺服器回應較慢，仍在等待…";
}
function post(body,opt){
  opt=opt||{};var tmos=opt.tmos||[15000,25000,40000];
  body.token=S.token;
  function once(i){
    var ac=typeof AbortController!=="undefined"?new AbortController():null,slowT=setTimeout(function(){slowTip(true);slowT=null},5000),timer;
    var timeout=new Promise(function(_,rej){timer=setTimeout(function(){if(ac)try{ac.abort()}catch(e){}rej(new Error("timeout"))},tmos[i])});
    var req=fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ac?ac.signal:undefined}).then(function(r){return r.text()});
    function done(){clearTimeout(timer);if(slowT)clearTimeout(slowT);else slowTip(false)}
    return Promise.race([req,timeout]).then(function(t){done();var o=null;try{o=JSON.parse(t)}catch(e){}if(!o)throw new Error("bad-json");return o},function(e){done();throw e})
      .catch(function(e){
        if(i+1<tmos.length)return new Promise(function(r){setTimeout(r,800*(i+1))}).then(function(){return once(i+1)});
        if(navigator.onLine===false)throw new Error("目前沒有網路連線");
        throw new Error("Google 伺服器忙碌或回應太慢，請稍後再試");
      });
  }
  return once(0).then(function(o){
    if(o.err==="need_login"){logout(true);throw new Error("請重新登入")}
    if(!o.ok)throw new Error(o.msg||"發生錯誤");
    return o;
  });
}

/* ---------- 資料同步 ---------- */
function saveCache(){
  try{localStorage.setItem(LS+"cache",JSON.stringify({ver:S.ver,meetings:S.meetings,people:S.people,cats:S.cats,sites:S.sites,
    defects:S.defects.filter(function(d){return !d._pending}).map(function(d){var o={};for(var k in d)if(k.charAt(0)!=="_")o[k]=d[k];return o})}))}catch(e){}
}
function loadCache(){
  try{var c=JSON.parse(localStorage.getItem(LS+"cache")||"null");if(c){S.meetings=c.meetings||[];S.defects=c.defects||[];S.people=c.people||[];S.cats=c.cats||[];S.sites=c.sites||[];S.ver=c.ver;S.loaded=true}}catch(e){}
}
function applyServer(r){
  var pend=S.defects.filter(function(d){return d._pending});
  var ids={};r.defects.forEach(function(d){ids[d.id]=1});
  S.meetings=r.meetings;S.defects=r.defects.concat(pend.filter(function(d){return !ids[d.id]}));
  S.people=r.people||[];S.cats=r.cats||[];S.sites=r.sites||[];S.ver=r.ver;S.loaded=true;S.offline=false;
  saveCache();schedule();
}
function refresh(){
  return post({action:"bootstrap"}).then(applyServer).catch(function(e){if(!S.needLogin){S.offline=true;toast("讀取失敗："+e.message);schedule()}});
}
function poll(){
  if(document.hidden||S.inflight||S.active||S.needLogin||!S.loaded)return;
  post({action:"ver"},{tmos:[10000]}).then(function(r){if(r.ver!==S.ver&&!S.inflight&&!S.active)return refresh()}).catch(function(){});
}
setInterval(poll,30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)poll()});

/* ---------- 照片 ---------- */
function loadImg(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=src})}
async function compress(src,max,limit){
  var url=typeof src==="string"?src:URL.createObjectURL(src);
  try{
    var img=await loadImg(url),q=.82,out="";
    for(var i=0;i<10;i++){
      var s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
      c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL("image/jpeg",q);
      if(out.length<limit)return out;
      if(q>.56)q-=.08;else max=Math.round(max*.82);
    }
    return out;
  }finally{if(typeof src!=="string")URL.revokeObjectURL(url)}
}
function photoSrc(fileId,w){
  if(!fileId)return"";
  if(S.local.has(fileId))return S.local.get(fileId);
  return "https://drive.google.com/thumbnail?id="+encodeURIComponent(fileId)+"&sz=w"+(w||600);
}
function imgTag(fileId,alt,w){var s=photoSrc(fileId,w);return s?'<img src="'+esc(s)+'" alt="'+esc(alt||"")+'" decoding="async" referrerpolicy="no-referrer">':""}

/* ---------- render ---------- */
function schedule(){
  var a=document.activeElement;
  if(a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="checkbox"&&a.type!=="file"){S.dirty=true;return}
  render();
}
app.addEventListener("focusout",function(){setTimeout(function(){if(S.dirty){S.dirty=false;schedule()}},0)});

function render(){
  var h=topbar();
  if(/請貼上/.test(GAS_URL)) h+='<div class="notice">尚未設定後端網址：請在 index.html 的 <code>GAS_URL</code> 貼上 Apps Script 部署後的 /exec 網址。</div>';
  else if(S.needLogin) h+=gateView();
  else if(S.view==="meeting"&&meeting(S.mid)) h+=meetingView(meeting(S.mid));
  else h+=homeView();
  if(S.lightbox) h+='<div class="lightbox" data-act="closebox"><img src="'+esc(S.lightbox)+'" alt="放大照片" referrerpolicy="no-referrer"></div>';
  app.innerHTML=h;
  fillDatalists();
}

/** 密碼先在這裡做 SHA-256 才送出（連線中不出現明碼） */
async function sha256hex(t){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return ("0"+x.toString(16)).slice(-2)}).join("")}
/** 登出：清掉憑證與這台裝置上的資料快取 */

  S.meetings=[];S.defects=[];S.loaded=false;S.needLogin=true;S.view="home";S.mid=null;render();
  if(expired)toast("登入已過期，請重新登入");

/* ---------- 寫入 ---------- */
function byName(){return S.me||""}
async function upd(id,patch){
  var d=S.defects.find(function(x){return x.id===id});if(!d)return;
  Object.assign(d,patch);schedule();
  if(d._pending)return;                 // 還在上傳，等上傳完成再一起送
  S.inflight++;
  try{await post({action:"defectUpdate",id:id,patch:patch,by:byName()});saveCache()}
  catch(e){toast("儲存失敗："+e.message+"（已重新讀取）");refresh()}
  finally{S.inflight--}
}
async function saveMeeting(m){
  S.inflight++;
  try{var r=await post({action:"meetingSave",m:m,by:byName()});var i=S.meetings.findIndex(function(x){return x.id===m.id});if(i>=0)S.meetings[i]=r.meeting;else S.meetings.push(r.meeting);saveCache();schedule();return true}
  catch(e){toast("儲存失敗："+e.message);refresh();return false}
  finally{S.inflight--}
}

/* 上傳佇列：同時 2 張，其餘排隊 */
function pump(){
  while(S.active<3&&S.queue.length){
    var job=S.queue.shift();S.active++;
    job().catch(function(){}).then(function(){S.active--;pump();schedule();if(!S.active&&!S.queue.length)saveCache()});
  }
  schedule();
}
async function uploadMany(files){
  if(!files.length)return;
  if(!S.me)toast("右上角填入你的名字，照片才知道是誰拍的");   // 不要自動把游標移過去：有欄位在輸入時畫面會暫停更新，上傳進度會看不到
  var loc=(document.getElementById("cur-loc")||{}).value;loc=(loc||S.lastLoc||"").trim();S.lastLoc=loc;
  var mid=S.mid,seq=Date.now();
  for(var i=0;i<files.length;i++){
    var data;try{data=await compress(files[i],1280,300000)}catch(e){toast("有一張照片讀不出來，已略過");continue}
    var d={id:uid(),mid:mid,seq:seq+i,location:loc,desc:"",by:S.me,photo:"",selected:false,done:false,_pending:true,_local:data};
    S.defects.push(d);S.queue.push(sendDefect.bind(null,d));
  }
  pump();
}
async function sendDefect(d){
  d._fail=false;
  try{
    var r=await post({action:"defectAdd",d:{id:d.id,mid:d.mid,seq:d.seq,location:d.location,desc:d.desc,by:d.by},photo:d._local},{tmos:[40000,60000,90000]});
    var sv=r.defect;S.local.set(sv.photo,d._local);
    var extra={};if(d.location!==sv.location)extra.location=d.location;if(d.desc!==sv.desc)extra.desc=d.desc;
    var i=S.defects.indexOf(d);if(i>=0)S.defects[i]=Object.assign(sv,extra);
    if(Object.keys(extra).length)await upd(sv.id,extra);
  }catch(e){d._fail=true;toast("照片上傳失敗："+e.message)}
}
async function uploadSlot(id,key,file){
  var data;try{data=await compress(file,1280,300000)}catch(e){toast("照片讀不出來");return}
  S.local.set(id+":"+key,data);
  S.queue.push(async function(){
    try{var r=await post({action:"defectPhoto",id:id,slot:key,photo:data,by:byName()},{tmos:[40000,60000,90000]});
      S.local.set(r.fileId,data);var d=S.defects.find(function(x){return x.id===id});if(d)d[key]=r.fileId;toast("照片已更新")}
    catch(e){toast("上傳失敗："+e.message)}
    finally{S.local.delete(id+":"+key)}
  });
  pump();
}

  else if(a==="closebox"){S.lightbox=null;render()}
  else if(a==="retry"){e.stopPropagation();var d2=S.defects.find(function(x){return x.id===id});if(d2){S.queue.push(sendDefect.bind(null,d2));pump()}}
  else if(a==="del"){S.confirmDel=id;render()}
  else if(a==="del-no"){S.confirmDel=null;render()}
  else if(a==="del-yes"){
    S.confirmDel=null;var keep=S.defects.slice();S.defects=S.defects.filter(function(x){return x.id!==id});render();
    S.inflight++;try{await post({action:"defectDelete",id:id,by:byName()});toast("已刪除");saveCache()}catch(err){S.defects=keep;toast("刪除失敗："+err.message);render()}finally{S.inflight--}
  }
  else if(a==="sel"){var d3=S.defects.find(function(x){return x.id===id});if(d3)await upd(id,{selected:!d3.selected})}
  else if(a==="done"){var d4=S.defects.find(function(x){return x.id===id});if(d4){await upd(id,{done:!d4.done});if(d4.done)toast("已標記完成")}}

/* ---------- 標註編輯器（同手機上傳頁）：旋轉、方框／圓圈／箭頭、紅黃藍、細中粗 ---------- */
var ED=null;
var COLORS=[["#E53935","紅"],["#FDD835","黃"],["#1E88E5","藍"]];
/** 取改善前照片原檔（雲端縮圖不能拿來畫，要經後端讀檔） */
async function photoData(fid){
  var v=S.local.get(fid);if(typeof v==="string"&&v.indexOf("data:")===0)return v;
  var r=await post({action:"photos",ids:[fid]},{tmos:[30000,45000]});
  if(!r.data[fid])throw new Error("讀不到照片檔");
  var src="data:image/jpeg;base64,"+r.data[fid];S.local.set(fid,src);return src;
}
/** 目前分頁看得到的照片（上一張／下一張的順序） */
function edListIds(){
  if(!S.mid)return [];
  var ds=defectsOf(S.mid).filter(function(x){return !x._pending});
  if(S.tab==="shoot"&&S.filter==="mine")ds=ds.filter(function(x){return x.by&&x.by===S.me});
  return ds.map(function(x){return x.id});
}
function openEditor(d){
  var box=document.createElement("div");box.className="ed";box.setAttribute("role","dialog");box.setAttribute("aria-label","照片標註");
  document.body.appendChild(box);document.body.style.overflow="hidden";
  ED={d:null,box:box,ids:edListIds(),shapes:[],drag:null,base:null,W:0,H:0,rotated:false,seq:0,
      tool:lsGet("ed_tool")||"rect",color:lsGet("ed_color")||COLORS[0][0],w:Number(lsGet("ed_w")||2),a:Number(lsGet("ed_a")||1)};
  edLoad(d);
}
async function edLoad(d){
  var my=++ED.seq;   // 快速連按下一張時，只顯示最後一張
  ED.d=d;ED.shapes=[];ED.drag=null;ED.base=null;ED.rotated=false;ED.warned=false;edRender(true);
  try{
    var src=d._localEdit||await photoData(d.photo);
    var img=await loadImg(src),c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext("2d").drawImage(img,0,0);
    if(!ED||ED.seq!==my)return;ED.base=c;ED.W=c.width;ED.H=c.height;edRender();
  }catch(e){if(ED&&ED.seq===my){toast("讀取照片失敗："+e.message);edRender()}}
}
/** 有畫標註或旋轉就排隊上傳（不關閉畫面） */
function edCommit(){
  if(!ED||!ED.base||(!ED.shapes.length&&!ED.rotated))return false;
  var d=ED.d,cv=ED.box.querySelector("#edc"),q=.86,out=cv.toDataURL("image/jpeg",q);
  while(out.length>300000&&q>.5){q-=.08;out=cv.toDataURL("image/jpeg",q)}
  d._localEdit=out;S.queue.push(sendEdit.bind(null,d,out));pump();
  ED.shapes=[];ED.rotated=false;
  return true;
}
function edGo(step){
  var i=ED.ids.indexOf(ED.d.id),j=i+step;
  if(i<0||j<0||j>=ED.ids.length)return;
  var nd=S.defects.find(function(x){return x.id===ED.ids[j]});if(!nd)return;
  edCommit();edLoad(nd);
}
async function edToggleSel(){
  var d=S.defects.find(function(x){return x.id===ED.d.id})||ED.d;await upd(d.id,{selected:!d.selected});
  if(ED&&ED.d.id===d.id){edRender(!ED.base);toast(d.selected?"已列入改善":"已取消列入改善")}
}
function closeEditor(){if(ED){ED.box.remove();ED=null;document.body.style.overflow=""}}
function edRender(loading){
  var b=ED.box,seg=function(g,list){return '<div class="seg" data-g="'+g+'">'+list.map(function(o){return '<button data-v="'+o[0]+'" aria-pressed="'+(String(ED[g])===String(o[0]))+'" aria-label="'+o[2]+'">'+o[1]+'</button>'}).join("")+'</div>'};
  var cur=S.defects.find(function(x){return x.id===ED.d.id});if(cur)ED.d=cur;   // 背景重新讀取後換成最新的資料
  var d=ED.d,i=ED.ids.indexOf(d.id),n=ED.ids.length,no=d.selected?selectedOf(d.mid).indexOf(d)+1:0;
  b.innerHTML='<div class="ed-top"><button data-ed="cancel" title="Esc">關閉</button>'+
    '<button class="nav" data-ed="prev" title="上一張（←）"'+(i>0?'':' disabled')+'>‹</button><span class="ed-info" style="padding:0"><span class="cnt">'+(i+1)+' / '+n+'</span></span>'+
    '<button class="nav" data-ed="next" title="下一張（→）"'+(i>=0&&i<n-1?'':' disabled')+'>›</button><span class="sp"></span>'+
    '<button data-ed="rot">⟳ 旋轉</button><button data-ed="undo"'+(ED.shapes.length?'':' disabled')+'>↶ 復原</button><button class="ok" data-ed="save">完成</button></div>'+
    '<div class="ed-info"><span class="t">'+esc(d.location||"（未填位置）")+'　<b>'+esc(d.desc||"（未填缺失說明）")+'</b>　<span style="opacity:.7">'+esc(d.by||"")+'</span></span>'+
    '<button data-ed="sel" class="'+(d.selected?"sel":"")+'">'+(d.selected?"✓ 已列入改善"+(no?"（"+pad2(no)+"）":""):"☐ 標記為需改善")+'</button></div>'+
    '<div class="ed-stage"><canvas id="edc"></canvas>'+(loading?'<div class="busy">讀取照片中…</div>':'')+'</div>'+
    '<div class="ed-tools">'+
      seg("tool",[["rect","▭ 方框","方框"],["circle","◯ 圓圈","圓圈"],["arrow","➜ 箭頭","箭頭"]])+
      seg("color",COLORS.map(function(c){return [c[0],'<span class="sw" style="background:'+c[0]+'"></span>'+c[1],c[1]]}))+
      seg("w",[[1,'<span class="lw" style="height:2px"></span>細',"細"],[2,'<span class="lw" style="height:5px"></span>中',"中"],[3,'<span class="lw" style="height:9px"></span>粗',"粗"]])+
      seg("a",[[1,'<span class="sw" style="background:'+ED.color+'"></span>100%',"不透明"],[.75,'<span class="sw" style="background:'+ED.color+';opacity:.75"></span>75%',"透明度 75%"],[.5,'<span class="sw" style="background:'+ED.color+';opacity:.5"></span>50%',"透明度 50%"],[.3,'<span class="sw" style="background:'+ED.color+';opacity:.3"></span>30%',"透明度 30%"]])+
    '</div>';
  var cv=b.querySelector("#edc");
  cv.addEventListener("pointerdown",edDown);cv.addEventListener("pointermove",edMove);cv.addEventListener("pointerup",edUp);cv.addEventListener("pointercancel",edUp);
  edDraw();
}
function edDraw(){
  if(!ED||!ED.base)return;var cv=ED.box.querySelector("#edc");cv.width=ED.W;cv.height=ED.H;
  var x=cv.getContext("2d");x.drawImage(ED.base,0,0);
  ED.shapes.concat(ED.drag?[ED.drag]:[]).forEach(function(s){edShape(x,s)});
}
function edLw(w){var u=Math.max(ED.W,ED.H)/300;return u*(w===1?2:w===3?7:4)}
function edShape(x0,s){
  var al=s.a==null?1:s.a,x=x0;
  if(al<1){   // 半透明：先畫在暫存圖層（重複使用同一張，拖曳時不卡）
    if(!ED.tmp||ED.tmp.width!==ED.W||ED.tmp.height!==ED.H){ED.tmp=document.createElement("canvas");ED.tmp.width=ED.W;ED.tmp.height=ED.H}
    x=ED.tmp.getContext("2d");x.clearRect(0,0,ED.W,ED.H);
  }
  var lw=edLw(s.w);x.save();x.strokeStyle=s.color;x.fillStyle=s.color;x.lineWidth=lw;x.lineCap="round";x.lineJoin="round";
  x.shadowColor="rgba(0,0,0,.45)";x.shadowBlur=lw*.8;
  var x1=s.x1,y1=s.y1,x2=s.x2,y2=s.y2;
  if(s.tool==="rect"){x.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1))}
  else if(s.tool==="circle"){x.beginPath();x.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,0,Math.PI*2);x.stroke()}
  else{
    var a=Math.atan2(y2-y1,x2-x1),hl=Math.max(lw*3.2,Math.max(ED.W,ED.H)/40),hw=hl*.6;
    var bx=x2-Math.cos(a)*hl*.85,by=y2-Math.sin(a)*hl*.85;
    x.beginPath();x.moveTo(x1,y1);x.lineTo(bx,by);x.stroke();
    x.beginPath();x.moveTo(x2,y2);x.lineTo(x2-Math.cos(a)*hl+Math.sin(a)*hw,y2-Math.sin(a)*hl-Math.cos(a)*hw);
    x.lineTo(x2-Math.cos(a)*hl-Math.sin(a)*hw,y2-Math.sin(a)*hl+Math.cos(a)*hw);x.closePath();x.fill();
  }
  x.restore();
  if(al<1){x0.save();x0.globalAlpha=al;x0.drawImage(x.canvas,0,0);x0.restore()}
}
function edPt(e){var cv=e.target,r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*ED.W/r.width,y:(e.clientY-r.top)*ED.H/r.height}}
function edDown(e){if(!ED||!ED.base)return;e.preventDefault();try{e.target.setPointerCapture(e.pointerId)}catch(err){}var p=edPt(e);ED.drag={tool:ED.tool,color:ED.color,w:ED.w,a:ED.a,x1:p.x,y1:p.y,x2:p.x,y2:p.y}}
function edMove(e){if(!ED||!ED.drag)return;var p=edPt(e);ED.drag.x2=p.x;ED.drag.y2=p.y;edDraw()}
function edUp(){
  if(!ED||!ED.drag)return;var s=ED.drag;ED.drag=null;
  if(Math.hypot(s.x2-s.x1,s.y2-s.y1)>Math.max(ED.W,ED.H)/60)ED.shapes.push(s);
  edRender();
}
function edRotate(){
  var o=ED.base,c=document.createElement("canvas");c.width=o.height;c.height=o.width;
  var x=c.getContext("2d");x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(o,0,0);
  var H=o.height;ED.shapes.forEach(function(s){var a=[H-s.y1,s.x1],b=[H-s.y2,s.x2];s.x1=a[0];s.y1=a[1];s.x2=b[0];s.y2=b[1]});
  ED.base=c;ED.W=c.width;ED.H=c.height;ED.rotated=true;edRender();
}
function edSave(){edCommit();closeEditor()}
/** 標註後的照片取代「改善前照片」（舊檔移到雲端垃圾桶） */
async function sendEdit(d,data){
  d._editing=true;d._editFail=null;schedule();
  try{var r=await post({action:"defectPhoto",id:d.id,slot:"photo",photo:data,by:byName()},{tmos:[40000,60000,90000]});
    S.local.set(r.fileId,data);d.photo=r.fileId;d._localEdit=null;saveCache();toast("標註已儲存")}
  catch(e){d._editFail=data;toast("標註上傳失敗："+e.message)}
  finally{d._editing=false}
}
document.addEventListener("click",function(e){
  if(!ED)return;var t=e.target.closest("button");if(!t||!ED.box.contains(t))return;
  var g=t.parentNode.dataset&&t.parentNode.dataset.g;
  if(g){var v=(g==="w"||g==="a")?Number(t.dataset.v):t.dataset.v;ED[g]=v;lsSet("ed_"+g,v);edRender();return}
  var a=t.dataset.ed;
  if(a==="cancel"){
    if((ED.shapes.length||ED.rotated)&&!ED.warned){ED.warned=true;toast("這張還有標註沒儲存，再按一次「關閉」會放棄；或按「完成」儲存");return}
    closeEditor();
  }
  else if(a==="undo"){ED.shapes.pop();edRender()}
  else if(a==="rot"){if(ED.base)edRotate()}
  else if(a==="save"){edSave()}
  else if(a==="prev")edGo(-1);
  else if(a==="next")edGo(1);
  else if(a==="sel")edToggleSel();
});
document.addEventListener("keydown",function(e){
  if(!ED)return;
  if(e.key==="Escape")closeEditor();
  else if(e.key==="ArrowLeft"){e.preventDefault();edGo(-1)}
  else if(e.key==="ArrowRight"){e.preventDefault();edGo(1)}
});

/* ---------- Excel ---------- */
function download(blob,filename){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000)}
function blobToB64(blob){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(String(r.result).split(",")[1])};r.readAsDataURL(blob)})}
/** Excel 工作表名稱：不能有 []*?/\: 、不能以單引號開頭或結尾、最多 31 字 */
function sheetName(s){return s.replace(/[\[\]\*\?\/\\:]/g," ").slice(0,31).replace(/^['\s]+|['\s]+$/g,"")||"缺失"}
var XF={name:"微軟正黑體",size:10},THIN={style:"thin",color:{argb:"FF000000"}},BOX={top:THIN,left:THIN,bottom:THIN,right:THIN};

/** 照片原檔 → 縮到 1000px 放進 Excel（檔案不會太大） */
async function fetchPhotos(ids){
  var out={},need=ids.filter(function(id){return id});
  for(var i=0;i<need.length;i+=6){
    var r=await post({action:"photos",ids:need.slice(i,i+6)},{tmos:[40000,60000,90000]});
    for(var k in r.data)if(r.data[k])out[k]=await compress("data:image/jpeg;base64,"+r.data[k],1000,400000);
    toast("讀取照片 "+Math.min(i+6,need.length)+" / "+need.length);
  }
  return out;
}
/** 照片置中貼到白底、比例同 B 欄照片格（35.75 字寬 × 3 列 60pt），放進格子不會變形 */
async function letterbox(src){
  var img=await loadImg(src),W=1000,H=Math.round(W*240/257),pad=W*0.03;
  var c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);
  var s=Math.min((W-2*pad)/img.naturalWidth,(H-2*pad)/img.naturalHeight),w=img.naturalWidth*s,h=img.naturalHeight*s;
  x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
  x.strokeStyle="#000";x.lineWidth=4;x.strokeRect(2,2,W-4,H-4);   // 照片蓋住了儲存格框線，畫回來
  return c.toDataURL("image/jpeg",.85);
}
async function exportXlsx(m){
  if(!window.ExcelJS){toast("Excel 元件尚未載入，請稍候再試");return}
  var list=selectedOf(m.id);if(!list.length||S.exporting)return;
  S.exporting=true;render();
  try{
    var ids=[];list.forEach(function(d){ids.push(d.photo,d.midPhoto,d.afterPhoto)});
    var pics=await fetchPhotos(ids);
    toast("正在產生 Excel…");
    var wb=new ExcelJS.Workbook();wb.creator="工地巡查缺失改善系統";wb.created=new Date();
    /* 總表 */
    var s0=wb.addWorksheet("總表",{pageSetup:{paperSize:9,orientation:"landscape",fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.3,footer:.3}}});
    s0.columns=[6,20,40,14,12,12,12,10,10].map(function(w){return{width:w}});
    s0.mergeCells("A1:I1");s0.getCell("A1").value="工務會議 "+roc(m.date)+"　"+m.site+"　工地巡查缺失改善總表";s0.getCell("A1").font=Object.assign({},XF,{size:14,bold:true});s0.getRow(1).height=26;
    var st=stats(m.id);s0.mergeCells("A2:I2");s0.getCell("A2").value="工程名稱："+m.project+"　　"+st.sel+"項缺失，已完成 "+st.done+"項";s0.getCell("A2").font=XF;
    var hr=s0.getRow(3);hr.values=["項次","位置","缺失說明","缺失類別","改善負責人員","預計改善日期","實際改善日期","狀態","拍照人員"];
    hr.eachCell(function(c){c.font=Object.assign({},XF,{bold:true});c.border=BOX;c.alignment={vertical:"middle",horizontal:"center",wrapText:true};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFEFEFEF"}}});
    list.forEach(function(d,i){var r=s0.getRow(4+i);r.values=[i+1,d.location,d.desc,d.category||"",d.owner||"",roc(d.planDate),roc(d.actualDate),d.done?"已完成":"改善中",d.by||""];
      for(var c=1;c<=9;c++){var cell=r.getCell(c);cell.font=XF;cell.border=BOX;cell.alignment={vertical:"middle",wrapText:true,horizontal:c===1||c>=6?"center":"left"}}});
    /* 每項一頁，版面同現行紀錄表 */
    for(var i=0;i<list.length;i++){
      var d=list[i];
      var ws=wb.addWorksheet(sheetName(pad2(i+1)+" "+(d.location||"")),{pageSetup:{paperSize:9,orientation:"portrait",scale:125,horizontalCentered:true,margins:{left:.39,right:.39,top:.98,bottom:.39,header:.51,footer:.2},printArea:"A1:C11"}});
      ws.headerFooter.oddHeader='&C&"標楷體,Regular"&16工地巡查缺失改善照片';
      ws.headerFooter.oddFooter="&L&9啓宇營造工程股份有限公司_工地巡查缺失改善照片&R&9 "+(i+1)+"/"+list.length;
      ws.columns=[{width:10.75},{width:35.75},{width:25.75}];
      ws.getRow(1).height=20.1;for(var r=2;r<=10;r++)ws.getRow(r).height=60;ws.getRow(11).height=30;
      ["A2:A4","B2:B4","A5:A7","B5:B7","A8:A10","B8:B10","C6:C7","C9:C10","A11:B11"].forEach(function(x){ws.mergeCells(x)});
      var set=function(ref,v,o){o=o||{};var c=ws.getCell(ref);c.value=v;c.font=Object.assign({},XF,{size:o.size||XF.size,bold:!!o.bold});c.alignment={wrapText:true,vertical:o.v||"top",horizontal:o.h||"left"}};
      set("A1","工程名稱：",{bold:true,v:"middle"});set("B1",m.project,{v:"middle"});set("C1","工務會議日期 :"+roc(m.date),{bold:true,v:"middle"});
      set("A2","改\n善\n前\n照\n片",{v:"middle",h:"center"});set("A5","改\n善\n中\n照\n片",{v:"middle",h:"center"});set("A8","改\n善\n後\n照\n片",{v:"middle",h:"center"});
      set("C2","預計改善日期 :"+roc(d.planDate)+"\n改善負責人員 :"+(d.owner||""),{size:9});
      set("C3","位置："+(d.location||""),{size:9});
      set("C4","缺失說明：\n"+(d.desc||""),{size:9});
      set("C5","實際改善日期 :"+roc(d.actualDate),{size:9});
      set("C6","改善作法說明：\n"+(d.method||""),{size:9});
      set("C8","拍攝日期："+roc(d.afterDate),{size:9});
      set("C9","矯正及預防措施說明：\n"+(d.prevent||""),{size:9});
      set("A11","工地人員簽名:",{bold:true});set("C11","缺失類別:"+(d.category||""),{bold:true});
      for(r=2;r<=10;r++)["A","B","C"].forEach(function(c){ws.getCell(c+r).border=BOX});
      var slots=[[d.photo,1],[d.midPhoto,4],[d.afterPhoto,7]];
      for(var j=0;j<3;j++){
        var src=pics[slots[j][0]];if(!src)continue;
        var imId=wb.addImage({base64:await letterbox(src),extension:"jpeg"});
        // 用儲存格四角定位（跟原本範本一樣），不管 Excel 怎麼換算欄寬列高，照片都剛好在格子裡
        ws.addImage(imId,{tl:{nativeCol:1,nativeColOff:0,nativeRow:slots[j][1],nativeRowOff:0},br:{nativeCol:2,nativeColOff:0,nativeRow:slots[j][1]+3,nativeRowOff:0},editAs:"twoCell"});
      }
    }
    var buf=await wb.xlsx.writeBuffer();
    var filename="工務會議"+rocDot(m.date)+"_"+m.site+"-工地巡查缺失改善照片.xlsx";
    var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    download(blob,filename);
    toast("已下載，正在存一份到雲端…");
    post({action:"saveExport",mid:m.id,filename:filename,xlsx:await blobToB64(blob)},{tmos:[60000,90000]})
      .then(function(r){S.saved={mid:m.id,folderUrl:r.folderUrl};toast("已存到雲端資料夾");schedule()})
      .catch(function(e){toast("檔案已下載，但存到雲端失敗："+e.message)});
  }catch(err){console.error(err);toast("產生 Excel 失敗："+err.message)}
  finally{S.exporting=false;schedule()}
}
/** 繳交進度表（取代手動維護的 xlsx） */
async function exportProgress(){
  if(!window.ExcelJS){toast("Excel 元件尚未載入，請稍候再試");return}
  var ms=S.meetings.slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date))});
  var wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("繳交進度表",{pageSetup:{paperSize:9,orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0}});
  ws.columns=[6,13,20,11,11,15,34].map(function(w){return{width:w}});
  ws.mergeCells("A1:G1");ws.getCell("A1").value="啓宇營造工程股份有限公司";ws.getCell("A1").font=Object.assign({},XF,{size:14,bold:true});ws.getCell("A1").alignment={horizontal:"center"};
  ws.mergeCells("A2:F2");ws.getCell("A2").value="工地巡查缺失改善照片 繳交進度表";ws.getCell("A2").font=Object.assign({},XF,{size:13,bold:true});ws.getCell("A2").alignment={horizontal:"center"};
  ws.getCell("G2").value="更新紀錄:"+roc(todayIso());ws.getCell("G2").font=XF;
  var hr=ws.getRow(3);hr.values=["項次","工務會議日期","工務會議地點","未提供建檔","進行改善中","繳交紙本完成\n【工地人員簽名完成】","備註"];hr.height=32;
  hr.eachCell(function(c){c.font=Object.assign({},XF,{bold:true});c.border=BOX;c.alignment={vertical:"middle",horizontal:"center",wrapText:true}});
  ms.forEach(function(m,i){
    var st=stats(m.id),a="",b="",c="",note="";
    if(m.skip)note="專案管理不必列缺失";
    else if(m.signed)c="○";else if(st.sel||st.photos)b="●";else a="▲";
    if(!m.skip&&st.sel)note=st.sel+"項缺失，已完成 "+st.done+"項";
    var r=ws.getRow(4+i);r.values=[i+1,roc(m.date),m.site,a,b,c,note];
    for(var k=1;k<=7;k++){var cell=r.getCell(k);cell.font=XF;cell.border=BOX;cell.alignment={vertical:"middle",horizontal:k===7?"left":"center",wrapText:true}}
  });
  download(new Blob([await wb.xlsx.writeBuffer()]),"工地巡查缺失改善照片 繳交進度表【更新日"+roc(todayIso()).replace(/\//g,"")+"】.xlsx");
}
